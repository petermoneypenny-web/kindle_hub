services:
  kindle-trading-desk:
    build: .
    container_name: kindle-trading-desk
    restart: unless-stopped
    # Host networking is required on this QNAP: bridge containers could not
    # reach Trading Hub via the NAS LAN address or the Docker gateway.
    network_mode: host
    environment:
      HOST: 0.0.0.0
      PORT: "5000"
      TRADING_HUB_URL: http://127.0.0.1:5095
      TRADING_HUB_STATS_PATH: /api/status
      STATS_CACHE_SECONDS: 10
