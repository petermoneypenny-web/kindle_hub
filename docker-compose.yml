services:
  kindle-trading-desk:
    build: .
    container_name: kindle-trading-desk
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      HOST: 0.0.0.0
      PORT: 5000
      TRADING_HUB_URL: http://192.168.0.217:5095
      # Set this to the actual read-only JSON stats route exposed by trading_hubV2.
      # Example: TRADING_HUB_STATS_PATH: /api/stats
      TRADING_HUB_STATS_PATH: ""
      STATS_CACHE_SECONDS: 15
